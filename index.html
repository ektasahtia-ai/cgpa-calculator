<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>Student CGPA Calculator 🎓</h1>

    <div class="input-box">
      <input type="number" id="grade1" placeholder="Subject 1 GPA">
      <input type="number" id="grade2" placeholder="Subject 2 GPA">
      <input type="number" id="grade3" placeholder="Subject 3 GPA">
      <input type="number" id="grade4" placeholder="Subject 4 GPA">
      <input type="number" id="grade5" placeholder="Subject 5 GPA">
    </div>

    <button onclick="calculateCGPA()">
      Calculate CGPA
    </button>

    <div class="result">
      <h2 id="output">
        Your CGPA will appear here
      </h2>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
